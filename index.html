    <link rel="stylesheet" href="style.css">

    <!-- fonts -->

  <body>

    <header>
      <div class="header-logo">
        <img src="/assets/images/logo.svg" alt="">

      <div class="header-mode-toggle">
        <img src="/assets/images/icon-sun.svg" alt="">
      </div>

    <section class="filter-section">
      <h2>Extensions List</h2>

      <div class="filters">

      </div>

      <div class="extension-card">

          <img src="/assets/images/logo-json-wizard.svg" alt="">

            <h3>SpeedBoost</h3>
            <p>Optimizes browser resource usage to accelerate page loading
            </p>
          </div>
        </div>
        <div class="extension-card-bottom">
          <button class="extension-btn">Remove</button>

          <label class="toggle-switch">
            <input type="checkbox" class="toggle-input">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
