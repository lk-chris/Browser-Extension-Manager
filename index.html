<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Browser Extensions Manager</title>
    <meta name="description" content="Manage and toggle browser extensions">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="assets/images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">

    <!-- fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Main Extension UI View -->

    <header>
      <div class="header-logo">
        <img src="assets/images/logo.svg" alt="App Logo">
      </div>
      <div class="header-mode-toggle" aria-label="Toggle dark/light theme" role="button" tabindex="0">
        <img class="mode-toggle" src="assets/images/icon-sun.svg" alt="Toggle theme">
      </div>
    </header>
    
    <section class="filter-section">
      <h2>Extensions List</h2>

      <div class="filters">
        <button class="btn btn-active js-filter-all">All</button>
        <button class="btn js-filter-active">Active</button>
        <button class="btn js-filter-inactive">Inactive</button>
      </div>
    </section>

    <section class="extensions-grid">
      
    </section>
    
    <script src="index.js" async defer></script>
  </body>
</html>
